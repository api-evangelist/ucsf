aid: ucsf
name: University of California, San Francisco
x-type: university
x-category: Public Research University
description: >-
  The University of California, San Francisco (UCSF) is a public health-sciences university and
  the only UC campus dedicated exclusively to graduate and health professions education,
  biomedical research, and patient care. Unlike most universities in this cohort, UCSF operates
  two genuinely institution-owned public APIs rather than renting them from a platform vendor:
  the UCSF Profiles JSON API, run by the UCSF Clinical and Translational Science Institute over
  8,000+ researcher records, and the UCSF Industry Documents Library Solr API, run by the UCSF
  Library Center for Knowledge Management over 28.2 million internal industry documents produced
  in tobacco, drug, chemical, food, fossil fuel and opioid litigation. Both are anonymous,
  read-only, and documented by UCSF itself. UCSF also operates a Shibboleth identity provider
  registered in the InCommon Federation as urn:mace:incommon:ucsf.edu. Everything else in UCSF's
  machine-readable footprint is a vendor platform running under a UCSF name — Dryad for research
  data, Ex Libris Primo for library discovery, CourseLeaf for the course catalog, and the
  California Digital Library's eScholarship for OAI-PMH harvesting — and is recorded here as a
  tenant relationship, not as UCSF engineering. There is no central UCSF developer portal: the
  developer.ucsf.edu host recorded in the June 2026 profile does not resolve on any public DNS
  resolver and has never been archived, and UCSF's API gateway at unified-api.ucsf.edu answers
  only with a Citrix challenge. UCSF publishes no OpenAPI, no changelog, and no status feed for
  either API it does run.
