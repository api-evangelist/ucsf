  description: >-
    Publicly readable REST content API behind the Industry Documents Library website, exposing 320 editorial
    pages — collection guides, curated document sets, field-name references, dataset listings, policies
    and release notes — as JSON. Undocumented and unversioned by UCSF; it exists because the IDL site
    is a decoupled single-page application. Recorded as a real institutional surface, but no derived OpenAPI
    is claimed for it because UCSF publishes no contract and makes no stability commitment. Verified live
    2026-08-19, returning 320 documents.
