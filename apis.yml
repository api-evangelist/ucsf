x-coverage:
  state: covered
  reason: institution_operated_surfaces_verified
  detail: >-
    UCSF is one of the few institutions in this cohort with a genuinely institution-operated
    programmable footprint, and it was fully reachable. Two public APIs on ucsf.edu hosts were
    probed live and returned real data — the UCSF Profiles JSON API and the UCSF Industry Documents
    Library Solr API (28,298,987 documents) — and UCSF's Shibboleth SAML metadata was retrieved
    signed from the InCommon MDQ service. Three education-regime domain standards are met on
    institution-operated surfaces (saml, shibboleth, orcid) and two more on tenant surfaces
    (oai-pmh via the California Digital Library's eScholarship, datacite via Dryad). What UCSF does
    NOT have is equally clear and is recorded rather than padded: no OpenAPI, no changelog, no
    status feed, no scopes, no machine-readable error contract, no course or registrar API, and no
    central developer portal. The developer.ucsf.edu host carried in the 2026-06-03 profile was
    removed after returning NXDOMAIN from three independent public resolvers with zero Internet
    Archive history, meaning it was never a publicly reachable surface. UCSF's API gateway at
    unified-api.ucsf.edu is live but answers every request with a Citrix NetScaler JavaScript
    challenge, so nothing is claimed from it. Four vendor-platform surfaces (Dryad, Ex Libris Primo,
    CourseLeaf, eScholarship) are recorded as tenant relationships; no vendor contract is saved.
  evidence:
    - url: https://api.profiles.ucsf.edu/json/v2/?source=apievangelist.com&ProfilesURLName=kirsten.bibbins-domingo
